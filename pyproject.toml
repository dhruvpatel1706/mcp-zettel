[project]
name = "mcp-zettel"
version = "0.1.0"
description = "MCP server exposing a Zettelkasten-style personal knowledge base (atomic notes, bidirectional links, tags) to any MCP client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dhruv Patel", email = "dhruv17062000@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "zettelkasten", "notes", "claude", "llm-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp[cli]>=1.20.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
]

[project.scripts]
mcp-zettel = "mcp_zettel.cli:app"
mcp-zettel-server = "mcp_zettel.server:main"

[project.urls]
Homepage = "https://github.com/dhruvpatel1706/mcp-zettel"
Issues = "https://github.com/dhruvpatel1706/mcp-zettel/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_zettel"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
